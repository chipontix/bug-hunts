name: ci
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: each bug before (must fail) and after (must pass) the upstream fix
        run: make verify
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
